name: pruebas

on: [push, pull_request]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # La misma versión que Render (render.yaml): así se comprueba que los artefactos cargan allá.
          python-version: "3.11.9"
          cache: pip
      - name: Instalar dependencias
        run: |
          pip install -r requirements-dash.txt
          pip install imbalanced-learn==0.12.4 optuna==5.0.0 deap==1.4.3 pytest==8.4.2
      - name: Pruebas
        run: python -m pytest -q
